<ActionBar title="Settings"></ActionBar>
<StackLayout padding="20">
  <Label text="Editar nombre" fontSize="20" fontWeight="bold"></Label>
  <TextField hint="Escribe tu nombre" [(ngModel)]="usuario" class="input"></TextField>
  <Button text="Guardar" (tap)="guardar()" class="-primary" marginTop="15"></Button>
  <Label [text]="'Guardado: ' + usuario" marginTop="20"></Label>
</StackLayout>
